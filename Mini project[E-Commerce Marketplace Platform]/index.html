<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>MarketPlace</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Categories</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h2>Welcome to Our Marketplace</h2>
        <p>Find the best products at affordable prices.</p>
    </section>

    <!-- Categories -->
    <section class="categories">
        <h2>Categories</h2>

        <div class="category-container">
            <div class="category-card">Electronics</div>
            <div class="category-card">Fashion</div>
            <div class="category-card">Books</div>
            <div class="category-card">Home Decor</div>
        </div>
    </section>

    <!-- Products -->
    <section class="products">
        <h2>Featured Products</h2>

        <div class="product-container">

            <div class="product-card">
                <img src="./headphones.jpg" alt="Product">
                <h3>Wireless Headphones</h3>
                <p>₹1999</p>
                <button>Buy Now</button>
            </div>

            <div class="product-card">
                <img src="./smart watch.jpg" alt="Product">
                <h3>Smart Watch</h3>
                <p>₹2499</p>
                <button>Buy Now</button>
            </div>

            <div class="product-card">
                <img src="./sports shoes.jpg" alt="Product">
                <h3>Sports Shoes</h3>
                <p>₹2999</p>
                <button>Buy Now</button>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 MarketPlace. All Rights Reserved.</p>
    </footer>

</body>
</html>
